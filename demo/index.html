<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>any-viewer demo</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif; background: #e9ecef; color: #1f2328; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #d9dde3; }
      header strong { margin-right: 8px; }
      button, label.pick { font: inherit; padding: 6px 12px; border: 1px solid #c5cad1; border-radius: 8px; background: #f6f7f9; cursor: pointer; }
      button:hover, label.pick:hover { background: #eceef1; }
      input[type='file'] { display: none; }
      #status { margin-left: auto; color: #6b7280; font-size: 13px; }
      #viewer { flex: 1 1 auto; min-height: 0; }
      body.drag #viewer { outline: 3px dashed #2563eb; outline-offset: -6px; }
      @media (prefers-color-scheme: dark) {
        body { background: #101114; color: #e6e8eb; }
        header { background: #1f2227; border-color: #343840; }
        button, label.pick { background: #2a2e35; border-color: #3d424b; color: inherit; }
        button:hover, label.pick:hover { background: #333842; }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>any-viewer</strong>
      <label class="pick">Open a file<input id="file" type="file" /></label>
      <button data-sample="png">PNG</button>
      <button data-sample="txt">TXT</button>
      <button data-sample="csv">CSV</button>
      <button data-sample="bigcsv">CSV, 300k rows</button>
      <button data-sample="pdf">PDF</button>
      <span id="status">Drop a file here</span>
    </header>
    <div id="viewer"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
