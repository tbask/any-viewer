version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: /packages/angular
    schedule:
      interval: monthly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - ng-packagr
          - zone.js
    ignore:
      # Angular supports a fixed TypeScript range; a newer TypeScript breaks the build.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
